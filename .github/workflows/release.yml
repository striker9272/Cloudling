name: Release binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux and Windows are published release assets. macOS (Apple Silicon)
          # is now built too, but as a workflow *artifact only* (`publish: false`):
          # the tray/packaging are not yet verified on real hardware, so we do not
          # attach a macOS asset to the public release until a live smoke test
          # passes. Flip `publish: true` for macos-arm64 once that smoke is done.
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            bin: clab
            artifact_name: claw-linux-x64
            publish: true
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: clab.exe
            artifact_name: claw-windows-x64.exe
            publish: true
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            bin: clab
            artifact_name: claw-macos-arm64
            publish: false
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      # The Linux asset is built as a fully static musl binary so it runs on any
      # distro regardless of glibc version. musl-tools provides the musl C
      # compiler needed by the C deps (ring, rusqlite). Build-time only — nothing
      # ships to users.
      - name: Install musl build tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release binary
        run: cargo build --release -p clab-cli --target ${{ matrix.target }}

      - name: Package artifact and checksum
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${{ matrix.artifact_name }}"
          chmod +x "dist/${{ matrix.artifact_name }}"
          (cd dist && { if command -v sha256sum >/dev/null; then sha256sum "${{ matrix.artifact_name }}"; else shasum -a 256 "${{ matrix.artifact_name }}"; fi; } > "${{ matrix.artifact_name }}.sha256")

      # Linux desktop artifact: a .deb so it installs with a double-click (the
      # graphical App Center / gdebi — no terminal), places "Claw Lab" in the
      # apps menu, and launches the tray role (`clab tray`: server + UI + tray
      # icon) like the Windows .exe. Reuses the static musl binary + assets/.
      - name: Build .deb (Linux desktop)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin   # rsvg-convert for the icon
          # Version: from the tag on a release; otherwise the workspace version
          # plus a -dev suffix for workflow_dispatch test builds. No hardcoding.
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')-dev"
          fi
          pkg="$(mktemp -d)/claw-lab"
          mkdir -p "$pkg/DEBIAN" "$pkg/usr/bin" \
                   "$pkg/usr/share/applications" \
                   "$pkg/usr/share/icons/hicolor/256x256/apps" \
                   "$pkg/usr/share/icons/hicolor/scalable/apps"
          install -m 755 "target/${{ matrix.target }}/release/${{ matrix.bin }}" "$pkg/usr/bin/clab"
          install -m 644 "$GITHUB_WORKSPACE/assets/claw-lab.desktop" "$pkg/usr/share/applications/claw-lab.desktop"
          rsvg-convert -w 256 -h 256 "$GITHUB_WORKSPACE/assets/claw-lab.svg" \
            -o "$pkg/usr/share/icons/hicolor/256x256/apps/claw-lab.png"
          install -m 644 "$GITHUB_WORKSPACE/assets/claw-lab.svg" \
            "$pkg/usr/share/icons/hicolor/scalable/apps/claw-lab.svg"
          # control file built line-by-line (avoids YAML/heredoc whitespace pitfalls;
          # Description continuation lines must start with a single space).
          {
            echo "Package: claw-lab"
            echo "Version: ${version}"
            echo "Section: utils"
            echo "Priority: optional"
            echo "Architecture: amd64"
            echo "Maintainer: Claw Lab <noreply@users.noreply.github.com>"
            echo "Description: Local agentic layer - model, agent, chat"
            echo " Wraps an OpenAI-compatible backend with built-in tools, web search,"
            echo " and an agent workflow; serves an OpenAI-compatible endpoint with a"
            echo " built-in web UI. 'clab tray' runs it as a desktop tray app."
          } > "$pkg/DEBIAN/control"
          deb="claw-lab_${version}_amd64.deb"
          dpkg-deb --build --root-owner-group "$pkg" "dist/${deb}"
          ( cd dist && sha256sum "${deb}" > "${deb}.sha256" )
          echo "DEB_NAME=${deb}" >> "$GITHUB_ENV"
          dpkg-deb --info "dist/${deb}"
          dpkg-deb --contents "dist/${deb}"
          ls -la dist

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            rust/dist/${{ matrix.artifact_name }}
            rust/dist/${{ matrix.artifact_name }}.sha256

      - name: Upload .deb workflow artifact
        if: matrix.target == 'x86_64-unknown-linux-musl'
        uses: actions/upload-artifact@v6
        with:
          name: claw-lab-deb
          path: |
            rust/dist/*.deb
            rust/dist/*.deb.sha256

      - name: Upload release asset
        if: matrix.publish && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            rust/dist/${{ matrix.artifact_name }}
            rust/dist/${{ matrix.artifact_name }}.sha256
          fail_on_unmatched_files: true

      - name: Upload .deb release asset
        if: matrix.target == 'x86_64-unknown-linux-musl' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            rust/dist/*.deb
            rust/dist/*.deb.sha256
          fail_on_unmatched_files: true
