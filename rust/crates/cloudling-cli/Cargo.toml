[package]
name = "cloudling-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "cloudling"
path = "src/main.rs"

[dependencies]
api = { path = "../api" }
axum = "0.8"
# Runtime-local date for the serve/REPL system prompt. `default-features = false`
# + `clock` keeps it lean (pure Rust, no C deps) so the static musl build is
# unaffected; `Local::now()` reads the host timezone (/etc/localtime or $TZ).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
commands = { path = "../commands" }
compat-harness = { path = "../compat-harness" }
crossterm = "0.28"
pulldown-cmark = "0.13"
rustyline = "15"
regex = "1"
# HTTP client types for the TTS backend (voice output); same version/features as the `api` crate,
# so no new crate enters the build.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
runtime = { path = "../runtime" }
plugins = { path = "../plugins" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
syntect = "5"
tokio = { version = "1", features = ["net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tools = { path = "../tools" }
tempfile = "3"
log = "0.4"
# Windows desktop integration (tray icon, console hiding, autostart, uninstall).
# Quarantines the unavoidable Win32 FFI `unsafe` so this crate keeps the
# upstream `unsafe_code = "forbid"`. No-op stubs off Windows; pulls no extra
# deps on Linux/macOS.
cloudling-desktop = { path = "../cloudling-desktop" }


[lints]
workspace = true

[dev-dependencies]
mock-anthropic-service = { path = "../mock-anthropic-service" }
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread"] }

