[package]
name = "clab-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "clab"
path = "src/main.rs"

[dependencies]
api = { path = "../api" }
axum = "0.8"
commands = { path = "../commands" }
compat-harness = { path = "../compat-harness" }
crossterm = "0.28"
pulldown-cmark = "0.13"
rustyline = "15"
runtime = { path = "../runtime" }
plugins = { path = "../plugins" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
syntect = "5"
tokio = { version = "1", features = ["net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tools = { path = "../tools" }
tempfile = "3"
log = "0.4"

# Windows-only desktop integration (tray icon + native console/window control).
# Gated to `cfg(windows)` so the Linux/macOS build pulls none of these and stays
# unchanged. `tray-icon` brings `muda` (menu) + `windows-sys`; on Windows it does
# NOT pull the Linux gtk / macOS objc deps (those are target-gated upstream).
[target.'cfg(windows)'.dependencies]
tray-icon = "0.24"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_UI_WindowsAndMessaging",
] }


[lints]
workspace = true

[dev-dependencies]
mock-anthropic-service = { path = "../mock-anthropic-service" }
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread"] }

